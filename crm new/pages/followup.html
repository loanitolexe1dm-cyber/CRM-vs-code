<div class="panel" style="padding: 24px;">
    <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--border2); padding-bottom: 16px; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <i class="fas fa-user-clock" style="color: var(--gold); font-size: 24px;"></i>
            <span style="font-weight: 800; font-size: 24px; color: var(--text); letter-spacing: -0.2px;">Follow Up Store (Active & Scheduled Cases)</span>
            <span class="badge" id="followup-count-badge" style="background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold); padding: 5px 16px; border-radius: 20px; font-size: 14.5px; font-weight: 800; text-transform: uppercase;">0 Follow Up Items</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn btn-primary" style="font-size: 15.5px; font-weight: 700; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;" onclick="openAddLead()"><i class="fas fa-plus"></i> Add Follow Up</button>
        </div>
    </div>
    <div class="panel-body" style="padding: 0;">
        <div style="margin-bottom: 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
            <div style="position: relative; max-width: 380px; width: 100%;">
                <input type="text" id="followupSearchInput" placeholder="Search follow up items..." class="tb-search" style="width: 100%; height: 46px; padding: 10px 18px 10px 46px; font-size: 15.5px; font-weight: 600;" oninput="renderFollowUpPage()" onkeydown="if(event.key==='Enter') renderFollowUpPage()">
                <i class="fas fa-search" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 17px; cursor: pointer;" onclick="renderFollowUpPage()" title="Click to filter"></i>
            </div>
            <select id="followupTypeFilter" class="tb-search" style="max-width: 200px; height: 46px; padding: 10px 16px; font-size: 15.5px; font-weight: 600;" onchange="renderFollowUpPage()">
                <option value="all">All Items</option>
                <option value="lead">Follow Up Leads</option>
                <option value="enquiry">Follow Up Enquiries</option>
                <option value="today">Today's Follow Ups</option>
                <option value="overdue">Overdue Follow Ups</option>
            </select>
            <select id="followupCategoryFilter" class="tb-search" style="max-width: 200px; height: 46px; padding: 10px 16px; font-size: 15.5px; font-weight: 600;" onchange="renderFollowUpPage()">
                <option value="all">All Departments</option>
                <option value="MSME">MSME</option>
                <option value="Retail - Unsecured">Retail - Unsecured</option>
                <option value="Retail - Secured">Retail - Secured</option>
                <option value="Other Segment">Other Segment</option>
            </select>
            <select id="followupLoanTypeFilter" class="tb-search" style="max-width: 200px; height: 46px; padding: 10px 16px; font-size: 15.5px; font-weight: 600;" onchange="renderFollowUpPage()">
                <option value="all">All Loan Types</option>
            </select>
        </div>
        <div id="followup-store-container"></div>
    </div>
</div>
