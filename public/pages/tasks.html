<div class="panel" style="border-radius:12px; overflow:hidden;">
    <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding:16px 20px;">
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:38px; height:38px; border-radius:10px; background:rgba(217, 161, 62, 0.15); border:1px solid rgba(217, 161, 62, 0.4); display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:18px;">
                <i class="fas fa-tasks"></i>
            </div>
            <div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-weight:800; font-size:18px; color:var(--text); letter-spacing:-0.3px;">Task & Work Management</span>
                    <span class="badge" id="tasks-count-badge" style="background:rgba(217, 161, 62, 0.15); color:var(--gold); border:1px solid rgba(217, 161, 62, 0.35); padding:2px 10px; border-radius:12px; font-size:11px; font-weight:700;">0 Tasks</span>
                </div>
                <div style="font-size:11px; color:var(--text2); margin-top:2px;">
                    Track allocated assignments, action items, customer follow-ups & team responsibilities
                </div>
            </div>
        </div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="openCreateTask()" style="font-weight:700;">
                <i class="fas fa-plus mr-1"></i> + Create Task
            </button>
        </div>
    </div>
    <div class="panel-body" style="padding:16px 20px;">
        <!-- Filter Controls -->
        <div id="tasks-filter-toolbar" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:20px; background:var(--surface2); padding:12px 16px; border-radius:10px; border:1px solid var(--border2);">
            <div style="flex:1; min-width:200px;">
                <div style="position:relative;">
                    <i class="fas fa-search" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text2); font-size:12px;"></i>
                    <input type="text" id="taskSearchInput" placeholder="Search tasks by title, lead, description, or notes..." oninput="renderTasks()" style="width:100%; padding:8px 12px 8px 34px; border-radius:8px; border:1px solid var(--border2); background:var(--surface); color:var(--text); font-size:12px;">
                </div>
            </div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <select id="taskFilterScope" onchange="renderTasks()" style="padding:7px 12px; border-radius:8px; border:1px solid var(--border2); background:var(--surface); color:var(--text); font-size:12px; font-weight:600;">
                    <option value="my">My Assigned Tasks</option>
                    <option value="all">All Team Tasks</option>
                    <option value="created">Created by Me</option>
                </select>
                <select id="taskFilterPriority" onchange="renderTasks()" style="padding:7px 12px; border-radius:8px; border:1px solid var(--border2); background:var(--surface); color:var(--text); font-size:12px;">
                    <option value="all">All Priorities</option>
                    <option value="Urgent">Urgent</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
                <select id="taskFilterAssignee" onchange="renderTasks()" style="padding:7px 12px; border-radius:8px; border:1px solid var(--border2); background:var(--surface); color:var(--text); font-size:12px;">
                    <option value="all">All Assignees</option>
                </select>
            </div>
        </div>

        <div style="margin-bottom:28px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid var(--border2); padding-bottom:8px;">
                <h4 style="margin:0; font-size:15px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px;">
                    <i class="fas fa-clock text-gold"></i> Active / Pending Tasks
                    <span id="pending-tasks-badge" class="badge" style="background:rgba(234, 179, 8, 0.15); color:#fde047; border:1px solid rgba(234, 179, 8, 0.35); font-size:11px;">0</span>
                </h4>
            </div>
            <div id="pending-tasks"></div>
        </div>

        <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid var(--border2); padding-bottom:8px;">
                <h4 style="margin:0; font-size:15px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px;">
                    <i class="fas fa-check-circle" style="color:#34d399;"></i> Completed Tasks
                    <span id="completed-tasks-badge" class="badge" style="background:rgba(16, 185, 129, 0.15); color:#34d399; border:1px solid rgba(16, 185, 129, 0.35); font-size:11px;">0</span>
                </h4>
            </div>
            <div id="completed-tasks"></div>
        </div>
    </div>
</div>
