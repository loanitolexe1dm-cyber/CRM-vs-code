<div class="panel">
    <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border2); padding-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-route text-gold fa-lg"></i>
            <span style="font-weight: 700; font-size: 18px; color: var(--text);">Process Workflow & Stage Timing Matrix</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="workflowLeadSelect" class="tb-search" style="min-width: 280px; height: 38px; padding: 0 12px;" onchange="renderWorkflowLeadDetails(this.value)">
                <option value="">-- Select Lead to inspect Workflow & Stage Dates --</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="openStageDatesForSelectedLead()"><i class="fas fa-calendar-alt mr-1"></i> Edit Stage Dates</button>
        </div>
    </div>
    <div class="panel-body">
        <div id="workflow-lead-container" style="margin-bottom: 24px;">
            <div class="no-data" style="padding: 24px; text-align: center; color: var(--text3);">Select a lead above to view and edit its complete stage workflow dates & processing durations.</div>
        </div>
        <div style="border-top: 1px solid var(--border2); padding-top: 20px;">
            <h4 style="margin-bottom: 12px; color: var(--gold); display: flex; align-items: center; gap: 8px;"><i class="fas fa-chart-line"></i> Global Stage Average Processing Time (CRM-Wide Workflow TAT)</h4>
            <div id="workflow-global-summary"></div>
        </div>
    </div>
</div>
